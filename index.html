<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votação de Websites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(14, 165, 233, 0.15);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="glass sticky top-0 z-40 border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-brand-600 to-indigo-600 p-3 rounded-xl shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-check-to-slot text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                        Portal de Votação
                    </h1>
                    <p class="text-xs text-slate-400">Avalie os melhores projetos desenvolvidos</p>
                </div>
            </div>

            <!-- Contador de Votos Restantes -->
            <div class="flex items-center space-x-4">
                <div class="bg-slate-900 border border-slate-800 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-300">
                    Votos realizados: <span id="userVoteCount" class="font-bold text-brand-400">0</span>/2
                </div>
                <button onclick="resetVotes()" class="text-xs text-slate-400 hover:text-rose-400 transition-colors flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-slate-800/50">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Resetar Votos</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

        <!-- Controls / Filters -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-8">
            <div class="flex flex-wrap gap-2 w-full md:w-auto" id="categoryFilters">
                <button onclick="setCategory('all')" id="btn-all" class="filter-btn active px-4 py-2.5 rounded-xl text-sm font-medium transition-all bg-brand-600 text-white shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-border-all mr-2"></i>Todos
                </button>
                <button onclick="setCategory('Clínica Veterinária')" class="filter-btn px-4 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 border border-slate-800 transition-all">
                    <i class="fa-solid fa-user-doctor mr-2"></i>Clínica Veterinária
                </button>
                <button onclick="setCategory('Petshop')" class="filter-btn px-4 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 border border-slate-800 transition-all">
                    <i class="fa-solid fa-paw mr-2"></i>Petshop
                </button>
                <button onclick="setCategory('Advocacia')" class="filter-btn px-4 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 border border-slate-800 transition-all">
                    <i class="fa-solid fa-scale-balanced mr-2"></i>Advocacia
                </button>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full md:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderCards()" placeholder="Buscar aluno ou URL..." class="w-full bg-slate-900/90 border border-slate-800 text-slate-200 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all">
            </div>
        </div>

        <!-- Grid -->
        <div id="sitesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-slate-900 border border-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-500">
                <i class="fa-solid fa-folder-open text-2xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-300">Nenhum site encontrado</h3>
        </div>

    </main>

    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
        <p>Sistema de Votação de Projetos - Atualizado em tempo real</p>
    </footer>

    <script>
        // CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyB4h8t9FKvCIBAKVpYX404tqFFoAFEjMz0",
            authDomain: "plasma-envoy-341217.firebaseapp.com",
            projectId: "plasma-envoy-341217",
            storageBucket: "plasma-envoy-341217.firebasestorage.app",
            messagingSenderId: "354127030177",
            appId: "1:354127030177:web:d4fe48af12e0cc35fa0de0",
            measurementId: "G-EWVBYT7LSC"
        };

        // Inicialização do Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const MAX_VOTES_PER_USER = 2; // Limite de 2 votos por usuário/sessão

        const initialSites = [
            { id: 1, author: 'Marley Renan', category: 'Clínica Veterinária', url: 'https://marley7976.github.io/site3/' },
            { id: 2, author: 'PIRES', category: 'Clínica Veterinária', url: 'https://arthurpires84.github.io/sitebarbara/' },
            { id: 3, author: 'Projeto 01', category: 'Clínica Veterinária', url: 'https://danilson90.github.io/site01/' },
            { id: 4, author: 'Pedro Ribeiro', category: 'Petshop', url: 'https://pedroribeiro26.github.io/patas-cia/index.html' },
            { id: 5, author: 'Kássio Vladimir', category: 'Petshop', url: 'https://kassiovladimirss-svg.github.io/sitekvznd/' },
            { id: 6, author: 'Sordi', category: 'Petshop', url: 'https://giansordi.github.io/Site3-PetShop/' },
            { id: 7, author: 'Amaral', category: 'Petshop', url: 'https://santos-amaral.github.io/site-1/' },
            { id: 8, author: 'Flores', category: 'Petshop', url: 'https://lucas-fff.github.io/site2/' },
            { id: 9, author: 'Lucas Lopes', category: 'Petshop', url: 'https://apkerror.github.io/site1/' },
            { id: 10, author: 'Akin', category: 'Advocacia', url: 'https://akimael.github.io/Site_02/' },
            { id: 11, author: 'PIERRE', category: 'Advocacia', url: 'https://pierrez01.github.io/site1/' },
            { id: 12, author: 'EMILY CHAVES', category: 'Advocacia', url: 'https://echavescms-eng.github.io/site4/' },
            { id: 13, author: 'G santos', category: 'Advocacia', url: 'https://guisantosss.github.io/SiteAdvogado/' },
            { id: 14, author: 'Viegas', category: 'Advocacia', url: 'https://viegas08.github.io/site1/' }
        ];

        let currentCategory = 'all';
        let votes = {};
        
        // Controle de votos locais da sessão
        let userVoteCount = parseInt(localStorage.getItem('user_vote_count') || '0');

        initialSites.forEach(site => {
            votes[site.id] = 0;
        });

        // Sincronização em Tempo Real via Firebase
        db.collection("votes").onSnapshot((snapshot) => {
            snapshot.forEach((doc) => {
                const count = doc.data().count;
                votes[doc.id] = count < 0 ? 0 : count;
            });
            renderCards();
        });

        function getCategoryIcon(cat) {
            switch(cat) {
                case 'Clínica Veterinária': return 'fa-user-doctor';
                case 'Petshop': return 'fa-paw';
                case 'Advocacia': return 'fa-scale-balanced';
                default: return 'fa-globe';
            }
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-brand-600', 'text-white', 'shadow-lg', 'shadow-brand-500/20');
                btn.classList.add('text-slate-400', 'hover:bg-slate-800/60', 'hover:text-slate-200');
            });
            event.currentTarget.classList.remove('text-slate-400', 'hover:bg-slate-800/60', 'hover:text-slate-200');
            event.currentTarget.classList.add('bg-brand-600', 'text-white', 'shadow-lg', 'shadow-brand-500/20');
            renderCards();
        }

        function vote(id, delta) {
            // Se tentar votar positivo mas já atingiu o limite de 2 votos
            if (delta > 0 && userVoteCount >= MAX_VOTES_PER_USER) {
                alert('Você já atingiu o limite máximo de 2 votos por sessão!');
                return;
            }

            const currentVotes = votes[id] || 0;
            const nextVotes = Math.max(0, currentVotes + delta);

            // Atualiza a contagem do usuário
            if (delta > 0) {
                userVoteCount++;
            } else if (delta < 0 && userVoteCount > 0) {
                userVoteCount--;
            }

            localStorage.setItem('user_vote_count', userVoteCount.toString());
            votes[id] = nextVotes;

            // Salva no Firebase
            db.collection("votes").doc(String(id)).set({
                count: nextVotes
            }, { merge: true });

            renderCards();
        }

        function resetVotes() {
            if (confirm('Tem certeza de que deseja zerar os votos do sistema e o seu limite local?')) {
                initialSites.forEach(site => {
                    votes[site.id] = 0;
                    db.collection("votes").doc(String(site.id)).set({ count: 0 });
                });
                userVoteCount = 0;
                localStorage.setItem('user_vote_count', '0');
                renderCards();
            }
        }

        function renderCards() {
            const grid = document.getElementById('sitesGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            // Atualiza badge no header
            document.getElementById('userVoteCount').textContent = userVoteCount;

            let filtered = initialSites.filter(site => {
                const matchesCat = currentCategory === 'all' || site.category === currentCategory;
                const matchesSearch = site.author.toLowerCase().includes(searchVal) || site.url.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            filtered.sort((a, b) => (votes[b.id] || 0) - (votes[a.id] || 0));

            grid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');

                filtered.forEach((site, index) => {
                    const count = votes[site.id] || 0;
                    const isGitHub = site.url.includes('github.com') && site.url.endsWith('.git');
                    const displayUrl = site.url.replace('https://', '').replace('.git', '');

                    let rankBadge = '';
                    if (index === 0 && count > 0) rankBadge = `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-2.5 py-1 rounded-full font-semibold"><i class="fa-solid fa-trophy mr-1"></i>1º</span>`;
                    else if (index === 1 && count > 0) rankBadge = `<span class="bg-slate-300/10 text-slate-300 border border-slate-300/30 text-xs px-2.5 py-1 rounded-full font-semibold"><i class="fa-solid fa-medal mr-1"></i>2º</span>`;
                    else if (index === 2 && count > 0) rankBadge = `<span class="bg-amber-700/10 text-amber-600 border border-amber-700/30 text-xs px-2.5 py-1 rounded-full font-semibold"><i class="fa-solid fa-award mr-1"></i>3º</span>`;

                    // Desabilita os botões dependendo das regras de limite e valor 0
                    const isPlusDisabled = userVoteCount >= MAX_VOTES_PER_USER;
                    const isMinusDisabled = count === 0;

                    const card = document.createElement('div');
                    card.className = 'glass rounded-2xl p-5 flex flex-col justify-between card-hover border border-slate-800/80';
                    card.innerHTML = `
                        <div>
                            <div class="flex items-start justify-between gap-3 mb-4">
                                <div>
                                    <span class="inline-flex items-center gap-1.5 text-xs text-brand-400 bg-brand-500/10 border border-brand-500/20 px-2.5 py-1 rounded-md font-medium mb-2">
                                        <i class="fa-solid ${getCategoryIcon(site.category)}"></i>
                                        ${site.category}
                                    </span>
                                    <h3 class="text-lg font-bold text-slate-100">${site.author}</h3>
                                </div>
                                ${rankBadge}
                            </div>

                            <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800/80 mb-5">
                                <a href="${site.url}" target="_blank" class="text-xs text-slate-300 hover:text-brand-400 font-mono flex items-center gap-2 truncate">
                                    <i class="${isGitHub ? 'fa-brands fa-github text-slate-400' : 'fa-solid fa-arrow-up-right-from-square text-brand-500'}"></i>
                                    <span class="truncate">${displayUrl}</span>
                                </a>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-800/60 flex items-center justify-between">
                            <a href="${site.url}" target="_blank" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                                Abrir site <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </a>

                            <div class="flex items-center bg-slate-900/90 rounded-xl border border-slate-800 p-1">
                                <button onclick="vote(${site.id}, -1)" ${isMinusDisabled ? 'disabled' : ''} class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-slate-400 disabled:cursor-not-allowed">
                                    <i class="fa-solid fa-minus text-xs"></i>
                                </button>
                                
                                <span class="px-3 font-bold text-sm min-w-[2.5rem] text-center ${count > 0 ? 'text-brand-400' : 'text-slate-400'}">
                                    ${count}
                                </span>

                                <button onclick="vote(${site.id}, 1)" ${isPlusDisabled ? 'disabled' : ''} class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-emerald-400 hover:bg-emerald-500/10 disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-slate-400 disabled:cursor-not-allowed">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        renderCards();
    </script>
</body>
</html>
